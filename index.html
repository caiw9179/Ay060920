<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小猫的AJ图鉴">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="96x96" href="icon-96.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<title>小猫的AJ专属赛博图鉴</title>
<style>
:root{
  --bg:#000; --card:#0a0a0a; --line:#1c1c1c; --line2:#2a2a2a;
  --mute:#555; --dim:#888; --soft:#bdbdbd; --fg:#fff;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"JetBrains Mono",Consolas,"Noto Sans Mono CJK SC",monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
body{overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
button{cursor:pointer;user-select:none;-webkit-user-select:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:calc(40px + var(--sab))}
.mono{font-family:var(--mono);letter-spacing:.02em}

/* header */
header{padding:calc(22px + var(--sat)) 20px 6px;display:flex;align-items:flex-start;justify-content:space-between}
.brand h1{font-size:19px;font-weight:600;letter-spacing:.04em}
.brand h1{display:flex;align-items:center;gap:9px}
.brand h1 .cat{flex:none;width:30px;height:22px;color:#fff;overflow:visible}
.brand p{margin-top:6px;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.08em}
.brand p b{color:var(--soft);font-weight:500}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:color .2s,background .2s}
.icon-btn:active{background:#111;color:#fff}
.icon-btn svg{width:20px;height:20px}

/* tabs */
.nav{position:sticky;top:0;z-index:10;background:linear-gradient(#000 80%,rgba(0,0,0,0));display:flex;align-items:center;padding:10px 0 12px}
.tabs{flex:1;display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;padding:0 20px;scroll-behavior:smooth;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;font-size:16px;font-weight:500;color:#666;padding:6px 0;position:relative;transition:color .25s var(--ease);letter-spacing:.03em;white-space:nowrap}
.tab.on{color:#fff;font-weight:700}
.tab::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:2px;background:#fff;border-radius:2px;transition:width .3s var(--ease),left .3s var(--ease)}
.tab.on::after{width:0}
.tab .n{font-family:var(--mono);font-size:10px;font-weight:400;margin-left:3px;vertical-align:top;color:inherit;opacity:.6}
.add-series{flex:none;width:40px;height:34px;margin:0 10px 0 2px;display:grid;place-items:center;color:var(--soft);transition:transform .15s,border-color .2s}
.add-series:active{transform:scale(.86)}
.add-series svg{width:16px;height:16px;color:#fff}

/* hall meta */
.hall{padding:2px 20px 14px;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.06em}
.bar{flex:1;height:1px;background:var(--line);margin:0 12px;position:relative;align-self:center}
.bar i{position:absolute;left:0;top:0;height:1px;background:#fff;transition:width .6s var(--ease)}

/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px}
@media (min-width:440px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#1c1c1e;transition:transform .18s var(--ease);cursor:pointer;user-select:none;-webkit-user-select:none;animation:fadeUp .5s var(--ease) both}
.card:active,.card.press{transform:scale(.955)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sil{position:absolute;inset:0;display:grid;place-items:center}
.sil svg{width:42%;height:42%;color:#2a2a2c;shape-rendering:geometricPrecision}
.sil.has-off svg{position:absolute;top:11px;left:11px;width:15px;height:14px;color:#2c2c2e}
.offimg{position:absolute;left:9%;right:9%;top:16%;bottom:26%;display:grid;place-items:center}
.offimg img{max-width:100%;max-height:100%;object-fit:contain;filter:grayscale(1) brightness(1.05) contrast(.95);opacity:.3;-webkit-user-drag:none;pointer-events:none}
.frame .tgt img{width:74%;max-height:60%;object-fit:contain;filter:grayscale(1);opacity:.35;transition:filter .6s var(--ease),opacity .6s var(--ease)}
.frame.done .tgt img{filter:none;opacity:1}
.card .tag{position:absolute;left:12px;right:12px;bottom:11px;z-index:3}
.card .tag .nm{font-size:12.5px;font-weight:600;line-height:1.32;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.nw{white-space:nowrap}
.card .tag .dt{font-family:var(--mono);font-size:10px;margin-top:3px;letter-spacing:.06em}
.card.unlit .tag .nm{color:#6a6a6e;font-size:11px;font-weight:500}
.card.unlit .tag .dt{display:none}
.card .corner{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:9px;color:#3a3a3d;letter-spacing:.1em;z-index:3}
.ph{position:absolute;inset:0;z-index:1}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .6s var(--ease)}
.grad{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 72%,rgba(0,0,0,.92) 100%)}
.card.lit .tag .nm{color:#fff}
.card.lit .tag .dt{color:rgba(255,255,255,.62)}
.ph.off{display:grid;place-items:center;padding:16% 9% 26%}
.ph.off img{width:100%;height:100%;object-fit:contain}
.dphoto.off img{object-fit:contain;padding:10% 8% 22%;box-sizing:border-box}
.opt{margin-left:6px;font-size:11px;color:#555;font-weight:400}
.card.sailed .ph img{filter:grayscale(1) contrast(1.05) brightness(.8)}
.card .mini-stamp{position:absolute;top:8px;right:8px;width:44px;height:44px;z-index:3;transform:rotate(-14deg);opacity:.9}
/* light-up B 显影: initial state here, motion driven by revealB() (Web Animations) */
.card.reveal,.grid.calm .card{animation:none}
.card.reveal>.sil{visibility:hidden}
.card.reveal .ph,.card.reveal .grad,.card.reveal .tag{opacity:0}
.card .ghost{position:absolute;inset:0;z-index:4;pointer-events:none}
.card .ghost .uname{position:absolute;left:12px;right:12px;bottom:11px;font-size:11px;font-weight:500;line-height:1.3;color:#6a6a6e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes tagIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card.new{border:1px dashed #2a2a2c;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#5a5a5a}
.card.new svg{width:22px;height:22px}
.card.new span{font-size:13px;letter-spacing:.08em}
.empty-hint{grid-column:1/-1;text-align:center;color:#444;font-size:12px;padding:22px 0 0;line-height:1.9}
.first{padding:120px 30px 0;text-align:center}
.first svg{width:96px;height:90px;color:#1f1f21}
.first h3{margin-top:22px;font-size:15px;font-weight:500;color:#bbb;letter-spacing:.06em}
.first p{margin-top:10px;font-size:12px;color:#555;line-height:1.9}
.first .mono{margin-top:26px;font-size:10px;color:#2c2c2c;letter-spacing:.2em}
.foot{text-align:center;color:#262626;font-family:var(--mono);font-size:10px;letter-spacing:.2em;margin-top:34px}

/* layers */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,104%);background:#000;border:1px solid #1c1c1e;border-bottom:0;border-radius:22px 22px 0 0;z-index:41;transition:transform .42s var(--ease);padding:10px 20px calc(22px + var(--sab));max-height:92vh;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:36px;height:4px;border-radius:4px;background:#2a2a2a;margin:0 auto 18px}
.sheet h2{font-size:18px;font-weight:600;letter-spacing:.04em}
.sheet .sub{margin-top:6px;color:var(--mute);font-size:12px;line-height:1.6}
.label{display:block;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.1em;margin:20px 0 8px}
.field{width:100%;background:#0e0e0f;border:1px solid #1c1c1e;border-radius:12px;padding:13px 14px;font-size:15px;transition:border-color .2s;color-scheme:dark}
.field:focus{border-color:#555}
.field::placeholder{color:#3c3c3c}
textarea.field{min-height:100px;resize:none;line-height:1.7}
.count{text-align:right;font-family:var(--mono);font-size:10px;color:#3a3a3a;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid #242424;font-size:13px;font-weight:600;color:var(--soft);transition:all .2s var(--ease);font-family:var(--mono)}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip:disabled{color:#2e2e2e;border-color:#151515;cursor:default}
.btn{width:100%;margin-top:22px;height:50px;border-radius:14px;background:#fff;color:#000;font-size:15px;font-weight:600;letter-spacing:.12em;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.25}
.btn.ghost{background:transparent;color:var(--dim);border:1px solid #222;margin-top:10px}
.btn.danger{background:transparent;color:#fff;border:1px solid #333}
.mod{display:flex;align-items:center;gap:14px;margin-top:18px}
.pick{flex:none;width:92px;height:92px;border-radius:14px;border:1px dashed #333;display:grid;place-items:center;overflow:hidden;background:#0e0e0f;color:#666;position:relative}
.pick img{width:100%;height:100%;object-fit:cover;display:block}
.pick svg{width:22px;height:22px}
.mod .txt b{display:block;font-size:14px;font-weight:600;color:#eee}
.mod .txt span{display:block;margin-top:5px;font-size:12px;color:#555;line-height:1.6}
.stepn{font-family:var(--mono);color:#444;margin-right:6px}
.cp-tools{position:sticky;top:-10px;z-index:3;background:#000;margin:14px -20px 0;padding:10px 20px 10px}
.cp-tools .field{padding:11px 14px;font-size:15px;-webkit-appearance:none;appearance:none}
.cp-f{display:flex;gap:6px;margin-top:10px}
.cp-f button{flex:1;height:32px;border-radius:999px;border:1px solid #1f1f21;font-size:12px;color:#777;letter-spacing:.06em;transition:all .2s var(--ease)}
.cp-f button.on{background:#fff;color:#000;border-color:#fff}
.cp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.cp-yr{grid-column:1/-1;font-family:var(--mono);font-size:10px;color:#444;letter-spacing:.14em;margin:12px 0 2px}
.cp-t{position:relative;display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:8px 8px 9px;border-radius:12px;background:#0b0b0c;border:1px solid #161618;min-width:0;transition:transform .15s var(--ease),border-color .2s}
.cp-t:active{transform:scale(.96)}
.cp-t .im{display:grid;place-items:center;aspect-ratio:16/10;margin-bottom:7px}
.cp-t .im svg{width:34px;height:34px;color:#2a2a2c}
.cp-t .im img{max-width:100%;max-height:100%;object-fit:contain;filter:grayscale(1) brightness(.78);opacity:.9}
.cp-t b{font-size:11px;font-weight:600;line-height:1.35;color:#d6d6d6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;min-height:2.7em}
.cp-t i{font-style:normal;font-family:var(--mono);font-size:9px;color:#4a4a4a;margin-top:4px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-t em{position:absolute;top:6px;right:7px;font-style:normal;font-family:var(--mono);font-size:8px;color:#000;background:#fff;border-radius:999px;padding:2px 6px;letter-spacing:.04em}
.cp-t em.u{background:#1c1c1e;color:#8a8a8a}
.cp-t.lit{border-color:#2c2c2e}
.cp-t.lit .im img{filter:none;opacity:1}
.cp-more{text-align:center;font-family:var(--mono);font-size:10px;color:#3a3a3a;letter-spacing:.08em;padding:14px 0 2px;min-height:20px}
.cw-row{display:flex;align-items:center;gap:10px}
.cw-row .im{flex:none;width:64px;height:46px;border-radius:10px;background:#0e0e0f;border:1px solid #1c1c1e;display:grid;place-items:center;overflow:hidden;color:#333}
.cw-row .im img{max-width:90%;max-height:86%;object-fit:contain}
.cw-row .im svg{width:30px;height:30px}
.cw-row .field{flex:1;min-width:0}
.cw-change{margin-top:8px;font-size:12px;color:#777;letter-spacing:.06em;padding:4px 0}
.sheet .label{margin-top:16px}
.preview{position:relative;margin-top:18px;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:#111}
.preview img{width:100%;height:100%;object-fit:cover;display:block}
.preview .swap{position:absolute;right:10px;bottom:10px;padding:7px 12px;border-radius:999px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);font-size:12px;border:1px solid rgba(255,255,255,.15)}
.row2{display:flex;gap:10px}
.row2 .btn{margin-top:22px}
.menu{margin-top:8px}
.menu button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 2px;border-bottom:1px solid #161616;font-size:15px;color:#ddd;text-align:left}
.menu button span{font-family:var(--mono);font-size:11px;color:var(--mute)}
.menu button:active{color:#fff}
.menu button.warn{color:#9a9a9a}
.note{margin-top:18px;font-size:11px;color:#3e3e3e;line-height:1.8;font-family:var(--mono)}

/* detail */
.detail{position:fixed;inset:0;z-index:30;background:#000;overflow-y:auto;opacity:0;pointer-events:none;transform:translateY(24px);transition:opacity .35s var(--ease),transform .4s var(--ease)}
.detail.on{opacity:1;pointer-events:auto;transform:none}
.dwrap{max-width:480px;margin:0 auto;padding-bottom:calc(30px + var(--sab))}
.dtop{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + var(--sat)) 12px 10px}
.dtop .icon-btn{background:rgba(0,0,0,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff}
.dwrap{position:relative}
.dtop .crumb{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.14em;padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(10px)}
.dphoto{position:relative;width:100%;height:min(68vh,600px);overflow:hidden;background:#0a0a0a}
.dphoto::after{content:"";position:absolute;left:0;right:0;bottom:0;height:45%;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.6) 55%,#000);pointer-events:none}
.dphoto .ov{position:absolute;left:22px;right:22px;bottom:18px;z-index:2}
.dphoto img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .8s var(--ease)}
.dphoto.sailed img{filter:grayscale(1) contrast(1.08) brightness(.78)}
.stamp{position:absolute;right:18px;top:calc(64px + var(--sat));z-index:3;width:128px;height:128px;opacity:0;transform:rotate(-14deg) scale(1.25);transition:opacity .35s var(--ease),transform .45s cubic-bezier(.3,1.4,.5,1);pointer-events:none;mix-blend-mode:screen}
.dphoto.sailed .stamp{opacity:.92;transform:rotate(-14deg) scale(1)}
.dbody{padding:14px 22px 0}
.dname{font-size:28px;font-weight:700;letter-spacing:.02em;line-height:1.25}
.dmeta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px;font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.05em}
.dmeta b{color:#fff;font-weight:500}
.dsec{margin-top:24px}
.dsec .label{margin:0 0 10px}
.memory{font-size:14px;line-height:2;color:#8e8e93;white-space:pre-wrap;word-break:break-word}
.memory.empty{color:#3a3a3a}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:#0d0d0d;border:1px solid #1c1c1c;border-radius:14px;padding:4px}
.seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:#fff;transition:transform .35s var(--ease)}
.seg.r i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;height:40px;font-size:14px;font-weight:600;color:#666;transition:color .3s;letter-spacing:.1em}
.seg button.on{color:#000}
.seg-note{margin-top:10px;font-size:12px;color:#444;line-height:1.7}
.dact{display:flex;justify-content:center;gap:28px;margin-top:30px}
.dact button{font-size:13px;color:#666;letter-spacing:.14em;padding:8px}
.dact button:active{color:#fff}

/* scan */
.scan{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scan.on{opacity:1;pointer-events:auto}
.scan:not(.on) *{pointer-events:none!important}
.scan .wrap{width:100%;max-width:480px;padding:0 28px;display:flex;flex-direction:column;align-items:stretch}
.scan .hd{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.14em;margin-bottom:16px}
.scan .hd b{color:#fff;font-weight:500}
.frame{position:relative;aspect-ratio:1/1;width:100%;border-radius:4px;overflow:hidden;background:
  linear-gradient(#000,#000) padding-box}
.frame .gridbg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px;background-position:center;animation:gridIn .6s var(--ease) both}
@keyframes gridIn{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.frame .cn{position:absolute;width:22px;height:22px;border-color:#fff;border-style:solid;border-width:0}
.cn.a{left:0;top:0;border-left-width:2px;border-top-width:2px}
.cn.b{right:0;top:0;border-right-width:2px;border-top-width:2px}
.cn.c{left:0;bottom:0;border-left-width:2px;border-bottom-width:2px}
.cn.d{right:0;bottom:0;border-right-width:2px;border-bottom-width:2px}
.frame .tgt{position:absolute;inset:0;display:grid;place-items:center}
.frame .tgt svg{width:52%;height:52%;color:#3a3a3a;transition:color .4s}
.frame.done .tgt svg{color:#fff}
.frame .line{position:absolute;left:0;right:0;height:2px;background:#fff;box-shadow:0 0 18px 2px rgba(255,255,255,.55);top:0;opacity:.9}
.frame .line::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:70px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.08))}
.frame.run .line{animation:scanY 1s cubic-bezier(.45,0,.55,1) 2 alternate both}
.frame.done .line{opacity:0;transition:opacity .2s}
@keyframes scanY{from{top:0}to{top:calc(100% - 2px)}}
.frame .pts{position:absolute;inset:0}
.frame .pts span{position:absolute;width:5px;height:5px;margin:-2.5px;border:1px solid #fff;opacity:0;transition:opacity .2s}
.frame .pts span.on{opacity:.8}
.frame .box{position:absolute;left:20%;top:20%;right:20%;bottom:20%;border:1px solid rgba(255,255,255,.0);transition:all .4s var(--ease)}
.frame.done .box{left:16%;top:16%;right:16%;bottom:16%;border-color:rgba(255,255,255,.5)}
.log{margin-top:18px;height:118px;font-family:var(--mono);font-size:11.5px;line-height:1.75;color:#5c5c5c;overflow:hidden}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log div.ok{color:#cfcfcf}
.prog{margin-top:8px;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:#fff}
.prog .t{flex:1;height:2px;background:#1a1a1a;position:relative;overflow:hidden}
.prog .t i{position:absolute;left:0;top:0;bottom:0;width:0;background:#fff}
.result{margin-top:20px;opacity:0;transform:translateY(8px);transition:all .4s var(--ease);pointer-events:none}
.result.on{opacity:1;transform:none;pointer-events:auto}
.result .k{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.14em}
.result .v{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:.02em}
.result .btn{margin-top:20px}

/* dialog + toast */
.dialog{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:opacity .25s}
.dialog.on{opacity:1;pointer-events:auto}
.dialog .box{width:calc(100% - 64px);max-width:320px;background:#0d0d0d;border:1px solid #1e1e1e;border-radius:18px;padding:24px 20px 16px;transform:scale(.96);transition:transform .3s var(--ease)}
.dialog.on .box{transform:none}
.dialog h3{font-size:16px;font-weight:600}
.dialog p{margin-top:8px;font-size:13px;color:#777;line-height:1.7}
.dialog .row2 .btn{height:44px;margin-top:20px;font-size:14px;letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:calc(34px + var(--sab));transform:translate(-50%,16px);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:500;z-index:70;opacity:0;transition:all .35s var(--ease);pointer-events:none;max-width:calc(100% - 40px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.auth{position:fixed;inset:0;z-index:60;background:#000;display:flex;justify-content:center;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .35s var(--ease)}
.auth.on{opacity:1;pointer-events:auto}
.au-x{position:absolute;top:calc(14px + var(--sat));right:14px;color:#555}
.au-in{width:100%;max-width:420px;padding:calc(96px + var(--sat)) 28px calc(28px + var(--sab));display:flex;flex-direction:column}
.au-cat{width:58px;height:43px;color:#fff;overflow:visible}
.au-k{margin-top:22px;font-size:10px;color:#3a3a3d;letter-spacing:.24em}
.auth h2{margin-top:10px;font-size:24px;font-weight:600;letter-spacing:.04em}
.au-sub{margin-top:10px;font-size:13px;line-height:1.75;color:var(--mute)}
.au-sub b{color:var(--soft);font-weight:400;font-size:13px}
.auth .label{margin-top:30px}
.au-link{display:block;margin:18px auto 0;font-size:12px;color:#555;letter-spacing:.04em;padding:6px}
.au-link:disabled{color:#333}
.au-row{display:flex;justify-content:space-between}
.au-row .au-link{margin:16px 0 0}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp i{height:54px;border-radius:12px;background:#0e0e0f;border:1px solid #1c1c1e;display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:22px;color:#fff;transition:border-color .2s}
.otp i.fill{border-color:#2c2c2e}
.otp i.cur{border-color:#fff}
.otp input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;color:transparent;caret-color:transparent;background:transparent;border:0}
.au-foot{margin-top:auto;padding-top:48px;font-size:10px;line-height:1.9;color:#2e2e30;letter-spacing:.12em;text-align:center}
.sync-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#333;margin-right:6px;vertical-align:1px}
.sync-dot.ok{background:#fff}
.sync-dot.busy{background:#888;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
</style>

  function row(kind, x, uid){
    if(kind === 'series') return { id:x.id, user_id:uid, name:x.name, sort:x.sort||0, updated_at:iso(x.updatedAt), deleted:false };
    const sn = seriesName(x.seriesId);
    return {
      id:x.id, user_id:uid, series_id:x.seriesId, name:x.name,
      colorway: sn && x.name.startsWith(sn) ? x.name.slice(sn.length).trim() : x.name,
      status: !x.lit ? 'unlit' : (x.sailed ? 'sailed' : 'lit'),
      got_date:x.date||null, memory:x.memory||null, sailed_date:x.sailedDate||null,
      photo_path:x.photoPath||null, sort:x.sort||0, updated_at:iso(x.updatedAt), deleted:false
    };
  }
  function fromRow(kind, r, l){
    const t = Date.parse(r.updated_at);
    if(kind === 'series') return { ...(l||{}), id:r.id, name:r.name, sort:r.sort, updatedAt:t };
    const same = l && l.photoPath && l.photoPath === r.photo_path;
    const x = { ...(l||{}), id:r.id, seriesId:r.series_id, name:r.name, lit:r.status !== 'unlit', sailed:r.status === 'sailed',
      date:r.got_date||null, memory:r.memory||'', sailedDate:r.sailed_date||null, photoPath:r.photo_path||null,
      sort:r.sort, updatedAt:t, createdAt:(l && l.createdAt) || t };
    if(!same){ delete x.photo; mem.delete(r.id); }
    delete x.photoDirty;
    return x;
  }
  /* 以 updated_at 为准，后写者胜。返回需要推上去的记录和需要拉下来的照片 */
  function merge(remote){
    const plan = { push:{series:[],shoes:[]}, tombs:[], uploads:[], downloads:[] };
    for(const kind of ['series','shoes']){
      const loc = new Map(s[kind].map(x => [x.id, x]));
      const rem = new Map((remote[kind]||[]).map(r => [r.id, r]));
      const tmb = new Map(s.tomb.filter(t => t.kind === kind).map(t => [t.id, t]));
      const ids = new Set([...loc.keys(), ...rem.keys(), ...tmb.keys()]);
      const next = [];
      for(const id of ids){
        const l = loc.get(id), r = rem.get(id), t = tmb.get(id);
        const lt = l ? l.updatedAt : (t ? t.updatedAt : 0);
        const rt = r ? Date.parse(r.updated_at) : 0;
        if(r && rt > lt){
          if(t) s.tomb = s.tomb.filter(z => z !== t);
          if(r.deleted) continue;
          const x = fromRow(kind, r, l); next.push(x);
          if(kind === 'shoes' && x.photoPath && !photo(x)) plan.downloads.push(x.id);
        }else{
          if(l){
            next.push(l);
            if(lt > rt){
              plan.push[kind].push(l.id);
              if(kind === 'shoes' && l.photo && (l.photoDirty || !l.photoPath)) plan.uploads.push(l.id);
            }else if(kind === 'shoes' && l.photoPath && !photo(l)) plan.downloads.push(l.id);
          }else if(t && lt > rt){ if(r) plan.tombs.push(t); else s.tomb = s.tomb.filter(z => z !== t); }
        }
      }
      next.sort((a,b) => (a.sort||0) - (b.sort||0));
      s[kind] = next;
    }
    if(s.current && !s.series.some(x => x.id === s.current)) s.current = s.series[0] ? s.series[0].id : null;
    persist(); emit('remote');
    return plan;
  }
  const find = (kind, id) => s[kind].find(x => x.id === id);
  function photoUploaded(id, path){ const x = find('shoes', id); if(!x) return; x.photoPath = path; delete x.photoDirty; persist(); }
  function cachePhoto(id, path, data){
    const x = find('shoes', id); if(!x || x.photoPath !== path) return;
    x.photo = data;
    if(!persist()){ delete x.photo; mem.set(id, data); }
    emit('remote');
  }
  function tombsDone(list){ s.tomb = s.tomb.filter(t => !list.includes(t)); persist(); }
  return {
    load, persist, commit, replace, setCurrent, onChange, photo, bytes,
    row, merge, find, photoUploaded, cachePhoto, tombsDone,
    get s(){ return s; }
  };
})();

/* ==========================================================
   Cloud：可选的 Supabase 登录与同步
   SUPABASE_URL / SUPABASE_ANON_KEY 为空时整个模块静默关闭，应用照常离线使用
   ========================================================== */
const Cloud = (() => {
  const enabled = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
  let sb = null;
  /* 只有填了地址和密钥才去 CDN 加载 supabase-js v2，离线或未配置时完全不联网 */
  const loadLib = () => window.supabase ? Promise.resolve() : new Promise((res, rej) => {
    const t = document.createElement('script'); t.src = SUPABASE_JS; t.async = true;
    t.onload = res; t.onerror = rej; document.head.appendChild(t);
  });
  let user = null, busy = false, again = false, timer = null, status = 'off', lastAt = 0;
  const subs = [];
  const emit = () => subs.forEach(f => f());
  const setStatus = v => { status = v; emit(); };
  const toBlob = d => fetch(d).then(r => r.blob());
  const toData = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); });

  async function init(){
    if(!enabled) return;
    try{ await loadLib(); }catch(e){ status = 'offline'; emit(); return; }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth:{ persistSession:true, storageKey:'aj-dex-auth' } });
    const { data } = await sb.auth.getSession();
    user = data && data.session ? data.session.user : null;
    status = user ? 'idle' : 'out'; emit();
    sb.auth.onAuthStateChange((ev, ses) => {
      const u = ses ? ses.user : null, changed = (u && u.id) !== (user && user.id);
      user = u; if(!u) status = 'out';
      emit(); if(u && changed) sync();
    });
    if(user) sync();
    window.addEventListener('online', () => schedule(100));
  }
  async function sendCode(email){
    if(!sb) throw new Error('not-configured');
    const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:true } });
    if(error) throw error;
  }
  async function verify(email, token){
    if(!sb) throw new Error('not-configured');
    const { data, error } = await sb.auth.verifyOtp({ email, token, type:'email' });
    if(error) throw error;
    user = data.user; emit();
    await sync();
  }
  async function signOut(){ if(sb) await sb.auth.signOut(); user = null; status = 'out'; emit(); }
  function schedule(ms = 800){ if(!user) return; clearTimeout(timer); timer = setTimeout(sync, ms); }

  async function sync(){
    if(!sb || !user) return;
    if(busy){ again = true; return; }
    busy = true; setStatus('syncing');
    try{
      const uid = user.id;
      const [a, b] = await Promise.all([ sb.from('series').select('*'), sb.from('shoes').select('*') ]);
      if(a.error) throw a.error; if(b.error) throw b.error;
      const plan = Store.merge({ series:a.data, shoes:b.data });
      // 1. 照片先上传到私有桶 photos/<user_id>/...
      for(const id of plan.uploads){
        const x = Store.find('shoes', id); if(!x || !x.photo) continue;
        const path = `${uid}/${id}-${Date.now().toString(36)}.jpg`;
        const up = await sb.storage.from('photos').upload(path, await toBlob(x.photo), { contentType:'image/jpeg', upsert:true });
        if(up.error) throw up.error;
        const old = x.photoPath; Store.photoUploaded(id, path);
        if(old && old !== path) sb.storage.from('photos').remove([old]).catch(() => {});
      }
      // 2. 本机较新的记录推上去
      const rows = kind => plan.push[kind].map(id => Store.find(kind, id)).filter(Boolean).map(x => Store.row(kind, x, uid));
      const rs = rows('series'), rh = rows('shoes');
      if(rs.length){ const r = await sb.from('series').upsert(rs); if(r.error) throw r.error; }
      if(rh.length){ const r = await sb.from('shoes').upsert(rh); if(r.error) throw r.error; }
      // 3. 删除以墓碑形式同步（deleted = true），照片一并清掉
      if(plan.tombs.length){
        for(const kind of ['series','shoes']){
          const t = plan.tombs.filter(z => z.kind === kind);
          if(!t.length) continue;
          const r = await sb.from(kind).upsert(t.map(z => ({ id:z.id, user_id:uid, name:'', deleted:true, updated_at:new Date(z.updatedAt).toISOString() })));
          if(r.error) throw r.error;
        }
        const paths = plan.tombs.map(z => z.photoPath).filter(Boolean);
        if(paths.length) sb.storage.from('photos').remove(paths).catch(() => {});
        Store.tombsDone(plan.tombs);
      }
      // 4. 云端照片通过签名链接取回，缓存到本机
      for(const id of plan.downloads){
        const x = Store.find('shoes', id); if(!x || !x.photoPath) continue;
        const { data, error } = await sb.storage.from('photos').createSignedUrl(x.photoPath, 600);
        if(error || !data) continue;
        const r = await fetch(data.signedUrl); if(!r.ok) continue;
        Store.cachePhoto(id, x.photoPath, await toData(await r.blob()));
      }
      lastAt = Date.now(); setStatus('idle');
    }catch(e){
      console.warn('[sync]', e);
      setStatus(navigator.onLine === false ? 'offline' : 'error');
    }
    busy = false;
    if(again){ again = false; schedule(300); }
  }
  return {
    enabled, init, sendCode, verify, signOut, sync, schedule,
    onChange: f => subs.push(f),
    get user(){ return user; }, get status(){ return status; }, get lastAt(){ return lastAt; }
  };
})();

Store.load();
function commit(mutate, failMsg){
  if(Store.commit(mutate)) return true;
  toast(failMsg || '存储空间已满，先导出备份再清理几张照片吧');
  return false;
}
const save = () => Store.persist();

const shoesOf = sid => Store.s.shoes.filter(x => x.seriesId === sid);
const shoe = id => Store.s.shoes.find(x => x.id === id);
const glue = s => esc(s).replace(/(\S配色(?:（[^）]*）)?)$/,'<span class="nw">$1</span>');
const shortNm = x => { const se=Store.s.series.find(z=>z.id===x.seriesId), p=se?se.name+' ':''; const n=String(x.name||''); return p && n.toUpperCase().startsWith(p.toUpperCase()) && n.length>p.length ? n.slice(p.length) : n; };
const litSrc = x => Store.photo(x) || offImg(x.name) || '';
const isOff = x => !Store.photo(x) && !!offImg(x.name);

function ghostHTML(x){ // the grey 待点亮 face, laid over the fresh card so it can develop away
  const o=offImg(x.name);
  return `<div class="ghost">${o?`<div class="sil has-off">${sil()}</div><div class="offimg"><img src="${o}" alt=""></div>`:''}<span class="corner">待点亮</span><div class="uname">${esc(x.name)}</div></div>`;
}
/* 点亮动画 B · 显影 (900ms): grey face fades out, photo saturation 0→1 + scale 1.02→1, gradient & text rise 8px */
function revealB(card){
  if(!card || !card.animate) return;
  const q=sel=>card.querySelector(sel), E='cubic-bezier(.22,1,.36,1)', F='cubic-bezier(.4,0,.2,1)';
  const ph=q('.ph'), img=q('.ph img'), grad=q('.grad'), tag=q('.tag'), g=q('.ghost');
  const an=(el,kf,o)=>el&&el.animate(kf,Object.assign({fill:'both',easing:E},o));
  const done=()=>{ card.classList.remove('reveal'); if(g) g.remove(); card.getAnimations({subtree:true}).forEach(a=>a.cancel()); };
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){
    if(g) g.remove();
    [ph,grad,tag].forEach(e=>an(e,[{opacity:0},{opacity:1}],{duration:200,easing:'ease-out'}));
    setTimeout(done,240); return;
  }
  if(g){
    an(g.querySelector('.offimg'),[{opacity:1,filter:'blur(0)'},{opacity:0,filter:'blur(2px)'}],{duration:500,easing:F});
    g.querySelectorAll('.sil,.corner,.uname').forEach(e=>an(e,[{opacity:1},{opacity:0}],{duration:260,easing:'linear'}));
  }
  an(ph,[{opacity:0},{opacity:1}],{duration:420,easing:F});
  an(img,[{filter:'saturate(0) brightness(.82)',transform:'scale(1.02)'},{filter:'saturate(1) brightness(1)',transform:'scale(1)'}],{duration:900});
  an(grad,[{opacity:0},{opacity:1}],{duration:500,delay:380});
  an(tag,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],{duration:520,delay:380});
  setTimeout(done,960);
}
function cardHTML(x,i){
  const d = `style="animation-delay:${Math.min(i,8)*30}ms"`;
  if(!x.lit) return `<div class="card unlit${offImg(x.name)?' has-img':''}" data-id="${x.id}" ${d}>${offImg(x.name)?`<div class="sil has-off">${sil()}</div><div class="offimg"><img src="${offImg(x.name)}" alt="" loading="lazy" decoding="async"></div>`:`<div class="sil">${sil()}</div>`}<span class="corner">待点亮</span><div class="tag"><div class="nm">${glue(shortNm(x))}</div><div class="dt">----.--.--</div></div></div>`;
  const cls = ['card','lit']; if(x.sailed) cls.push('sailed'); if(justLit===x.id) cls.push('reveal');
  return `<div class="${cls.join(' ')}" data-id="${x.id}" ${justLit===x.id?'':d}><div class="sil">${sil()}</div><div class="ph${isOff(x)?' off':''}">${litSrc(x)?`<img src="${litSrc(x)}" alt="" decoding="async">`:''}</div><div class="grad"></div>${justLit===x.id?ghostHTML(x):''}${x.sailed?`<div class="mini-stamp">${stampSvg()}</div>`:''}<div class="tag"><div class="nm">${glue(shortNm(x))}</div><div class="dt">${x.sailed?'已远航':''}${x.sailed&&x.date?' · ':''}${x.date?fmt(x.date):(x.sailed?'':'已点亮')}</div></div></div>`;
}

/* photo compression */
let photoMode='light', editDraft=null;
function compress(file, max=800, q=0.82){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth, h=img.naturalHeight; const r=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*r); h=Math.round(h*r);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const cx=cv.getContext('2d'); cx.fillStyle='#000'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg',q));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad')); };
    img.src=url;
  });
}
$('#filePhoto').onchange=async e=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  let data;
  try{ data=await compress(f); }catch(err){ toast('这张照片读不出来，换一张试试'); return; }
  if(editDraft){ editDraft.photo=data; editDraft.refresh && editDraft.refresh(); }
};

  const el = $('#auth');

  function show(step){
    el.classList.add('on');

    else setTimeout(() => el.querySelector('#auEmail').focus(), 250);

    const v = el.querySelector('#auCode').value;
    el.querySelectorAll('.otp i').forEach((b,i) => { b.textContent = v[i] || ''; b.classList.toggle('cur', i === Math.min(v.length,5) && document.activeElement === el.querySelector('#auCode')); b.classList.toggle('fill', !!v[i]); });

  }
  function tick(){
    const r = el.querySelector('#auResend');
    r.disabled = cd > 0; r.textContent = cd > 0 ? `重新发送 ${cd}s` : '重新发送';
    if(cd > 0){ cd--; cdTimer = setTimeout(tick, 1000); }
  }
  async function send(){
    const inp = el.querySelector('#auEmail'), b = el.querySelector('#auSend');
    const v = inp.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ toast('邮箱格式好像不对'); return; }
    if(!Cloud.enabled){ toast('云端还没接入，按 supabase/README.md 填好地址和密钥就能用'); return; }
    b.disabled = true; b.textContent = '发送中';
    try{ await Cloud.sendCode(v); email = v; show(2); clearTimeout(cdTimer); cd = 60; tick(); }
    catch(e){ toast(/rate|seconds/i.test(e.message||'') ? '发送太频繁了，稍等一会儿再试' : '验证码没发出去，检查一下网络再试'); }
    b.disabled = false; b.textContent = '发送验证码';
  }
  async function verify(){
    const code = el.querySelector('#auCode').value, b = el.querySelector('#auVerify');
    if(code.length !== 6) return;
    b.disabled = true; b.textContent = '验证中';
    try{ await Cloud.verify(email, code); hide(); localStorage.removeItem(SKIP); toast('登录成功，鞋柜已同步'); }
    catch(e){ toast('验证码不对或已过期'); el.querySelector('#auCode').value = ''; paint(); }
    b.textContent = '登录';
  }
  el.querySelector('#auSend').onclick = send;
  el.querySelector('#auEmail').onkeydown = e => { if(e.key === 'Enter') send(); };
  const code = el.querySelector('#auCode');
  code.oninput = () => { code.value = code.value.replace(/\D/g,'').slice(0,6); paint(); if(code.value.length === 6) verify(); };
  code.onfocus = code.onblur = paint;
  el.querySelector('.otp').onclick = () => code.focus();
  el.querySelector('#auVerify').onclick = verify;
  el.querySelector('#auResend').onclick = async () => { try{ await Cloud.sendCode(email); cd = 60; tick(); toast('新的验证码已发出'); }catch(e){ toast('发送太频繁了，稍等一会儿再试'); } };
  el.querySelector('#auBack').onclick = () => show(1);
  el.querySelector('#auSkip').onclick = () => { localStorage.setItem(SKIP, '1'); hide(); };
  el.querySelector('#auClose').onclick = hide;
  return {
    show, hide,
    maybeShowOnStart(){ if(Cloud.enabled && !Cloud.user && !localStorage.getItem(SKIP)) show(1); }
  };
})();

Store.onChange(kind => { if(kind === 'local') Cloud.schedule(); else if(!$('#sheet').classList.contains('on')) render(); });
render();
if(Store.s.shoes.some(x=>!offImg(x.name))) loadCatalog().then(render).catch(()=>{}); else setTimeout(()=>loadCatalog().catch(()=>{}),1500);
Cloud.init().then(() => Auth.maybeShowOnStart());
window.__dex={get state(){return Store.s;}, Store, Cloud, Auth, loadCatalog, get catalog(){return CAT;}, offImg};
})();
</script>
</body>
</html>
