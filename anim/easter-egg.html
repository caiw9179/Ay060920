  const wob=lattice(RW,RH,34*D,rng(21)),wob2=lattice(RW,RH,9*D,rng(22));
  const gi=gr?gr.getContext('2d').createImageData(RW,RH):null;
  gr=mk(RW,RH);const gg=gr.getContext('2d'),id=gg.createImageData(RW,RH),d=id.data;
  const rr=rng(404);
  for(let y=0;y<RH;y++){
    for(let x=0;x<RW;x++){
      const i=y*RW+x,c=sc[i];if(c<.02)continue;
      const p=pd[i*4]/255;                     // 0 hairline … 1 heavy downstroke
      const ti=(y+RY)*PW+(x+RX),t=tooth[ti];
      const peff=clamp(.40+.58*p+(wob(x,y)-.5)*.30+(wob2(x,y)-.5)*.10);
      // deposit: graphite catches on tooth peaks; more pressure fills the valleys
      const th=(t-.5)*1.05;
      let dep=sm((c*.95+peff*.62+(0)-th*1.0-.62)/.22);
      // fine grain breakup (second, independent speckle)
      const sp=rr();
      dep*=.80+.30*sp*sp+ (peff>.8?.1:0);
      dep=clamp(dep);
      if(dep<.015)continue;
      const lum=132+ 108*peff*(.5+.5*t) + 14*(sp-.5);
      d[i*4]=lum-2;d[i*4+1]=lum-1;d[i*4+2]=lum-5;
      d[i*4+3]=Math.min(255,dep*255*(.78+.22*peff));
    }
  }
  gg.putImageData(id,0,0);
  mc=mk(RW,RH);oc=mk(RW,RH);prog={si:0,pi:0};
  glyphPath=null;
}
// ---------- render ----------
function strokePt(s,i){return [(OX+s.x[i]*K)*D-RX,(OY+s.y[i]*K)*D-RY]}
function drawMaskTo(P){
  const g=mc.getContext('2d');
  // reset if going backwards
  if(P<prog.P-1e-9){g.clearRect(0,0,RW,RH);prog={si:0,pi:0,P:0}}
  g.fillStyle=g.strokeStyle='#fff';g.lineCap='round';g.lineJoin='round';
  let si=prog.si,pi=prog.pi;
  const S=HW.strokes;
  for(;si<S.length;si++){
    const s=S[si],n=s.x.length;
    if(s.t[0]>P){break}
    for(let i=Math.max(1,pi);i<n;i++){
      let x1=s.x[i],y1=s.y[i],r1=s.r[i];
      let frac=1;
      if(s.t[i]>P){frac=(P-s.t[i-1])/(s.t[i]-s.t[i-1]);if(!(frac>0))break;}
      const a=strokePt(s,i-1);let b=strokePt(s,i);
      if(frac<1){b=[a[0]+(b[0]-a[0])*frac,a[1]+(b[1]-a[1])*frac]}
      const r=((s.r[i]+s.r[i-1])/2*1.35+1.4)*K*D;
      g.lineWidth=2*r;g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
      if(frac<1){return finish(si,Math.max(1,i),P,true)} // partial segment: redraw it next time
      pi=i+1;
    }
    pi=0;
  }
  function finish(si_,pi_,P_,partial){prog={si:si_,pi:pi_,P:P_};}
  prog={si:si,pi:0,P:P};
}
function render(t){
  if(!bg)return;
  const g=ctx;g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';
  g.drawImage(bg,0,0);
  let P=clamp((t-WR0)/(WR1-WR0));P=mix(P,sm(P),.22);
  if(P>0){
    // partial last segment is re-drawn each frame, so rebuild when the front sits inside a segment
    const mg=mc.getContext('2d');
    mg.clearRect(0,0,RW,RH);prog={si:0,pi:0,P:0};
    drawMaskTo(P);
    const og=oc.getContext('2d');og.globalCompositeOperation='copy';og.drawImage(mc,0,0);
    og.globalCompositeOperation='source-in';og.drawImage(gr,0,0);
    g.drawImage(oc,RX,RY);
  }
  const intro=sm(t/.7),outro=sm((t-FADE0)/(DUR-FADE0));
  const a=Math.max(1-intro,outro);
  if(a>0){g.globalAlpha=a;g.fillStyle='#050506';g.fillRect(0,0,PW,PH);g.globalAlpha=1}
}
// ---------- sizing ----------
let lastT=0,built=false;
function setup(){
  W=Math.max(2,Math.round(innerWidth));H=Math.max(2,Math.round(innerHeight));
  D=Math.min(devicePixelRatio||1,2);
  if(W*H*D*D>3000000)D=Math.max(1,Math.sqrt(3000000/(W*H)));
  PW=Math.round(W*D);PH=Math.round(H*D);cv.width=PW;cv.height=PH;
  buildPaper();buildGraphite();built=true;
}
let rsz=0;addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(()=>{if(built){setup();render(lastT)}},150)});
const readyP=Promise.resolve().then(()=>{setup()});
function ready(){return readyP}
// ---------- playback / API ----------
const closeBtn=document.getElementById('close'),hint=document.getElementById('hint');
let raf=0,t0=0,playing=false,ended=false,skipping=0,cbEnd=null;
function fireEnd(skipped){if(ended)return;ended=true;playing=false;cancelAnimationFrame(raf);
  try{cbEnd&&cbEnd({skipped})}catch(e){}
  window.dispatchEvent(new CustomEvent('easteregg:end',{detail:{skipped}}));
  try{parent!==window&&parent.postMessage({type:'easteregg-end',skipped},'*')}catch(e){}}
function loop(now){
  if(!playing)return;
  let t=(now-t0)/1000;
  if(skipping){const kk=(now-skipping)/600;if(kk>=1){fireEnd(true);return}cv.style.opacity=String(1-kk)}
  if(t>=DUR){lastT=DUR;render(DUR);fireEnd(false);closeBtn.classList.add('on');return}
  lastT=t;render(t);raf=requestAnimationFrame(loop)}
function start(opts={}){
  cbEnd=opts.onEnd||null;if(opts.quiet!=null)QUIET=!!opts.quiet;
  ended=false;skipping=0;cv.style.opacity='1';
  return ready().then(()=>{playing=true;t0=performance.now();raf=requestAnimationFrame(loop);
    if(!QUIET){setTimeout(()=>{closeBtn.classList.add('on');hint.classList.add('on')},1400);setTimeout(()=>hint.classList.remove('on'),5500)}else setTimeout(()=>closeBtn.classList.add('on'),1400)})}
function skip(){if(!playing||skipping)return;skipping=performance.now()}
document.getElementById('stage').addEventListener('pointerdown',()=>{if(playing)skip()});
closeBtn.addEventListener('click',e=>{e.stopPropagation();if(playing)skip();else fireEnd(true)});
addEventListener('keydown',e=>{if(e.key==='Escape')skip()});
window.EasterEgg={start,skip,duration:DUR,setQuiet:q=>{QUIET=!!q},seek:t=>ready().then(()=>{playing=false;cancelAnimationFrame(raf);lastT=t;render(t)})};
window.__seek=t=>{playing=false;cancelAnimationFrame(raf);lastT=t;render(t)};
window.__ready=ready();
const qs=new URLSearchParams(location.search);
if(qs.has('rec'))document.body.classList.add('rec');
if(qs.has('quiet'))QUIET=true;
if(qs.has('t')){ready().then(()=>render(parseFloat(qs.get('t'))))}
else if(!qs.has('manual')&&!qs.has('rec'))start();
})();
</script>
